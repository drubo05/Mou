<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mou ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene" id="scene">

        <!-- =========================
             BACKGROUND
        ========================== -->

        <div class="stars"></div>


        <!-- =========================
             FIRST PAGE
        ========================== -->

        <section
            class="start-screen"
            id="startScreen"
        >

            <h1>
                Mou you Are My Special ❤️<br>
                
            </h1>

            <button
                id="bloomBtn"
                type="button"
            >
                Click Koro 🤛🏻
            </button>

        </section>


        <!-- =========================
             SECOND PAGE
        ========================== -->

        <section
            class="flower-section"
            id="flowerSection"
        >

            <!-- TaRa title -->

            <div class="tara-title">
                <span>♡</span>
                Mou
                <span>♡</span>
            </div>


            <!-- Flower -->

            <div class="flower">

                <div class="flower-glow"></div>

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>

                <div class="leaf leaf-right"></div>


                <!-- Rose -->

                <div class="rose">

                    <div class="petal petal-1"></div>
                    <div class="petal petal-2"></div>
                    <div class="petal petal-3"></div>
                    <div class="petal petal-4"></div>
                    <div class="petal petal-5"></div>
                    <div class="petal petal-6"></div>
                    <div class="petal petal-7"></div>
                    <div class="petal petal-8"></div>
                    <div class="petal petal-9"></div>

                    <div class="rose-center"></div>

                </div>

            </div>


            <!-- Second page text -->

            <div class="tara-message">

                <div class="message-name">
                    ♡ Mou ♡
                </div>

                <div class="message-line">
                    ─────── ♥ ───────
                </div>

                <p>
                   Mou, I know you’re with someone, but I can’t hide this anymore.
                    <br>
                I now remember our past days when we were together and so happy 🙂❤️‍🩹
                    <br>
                </p>

                <div class="bottom-heart">
                    ♥
                </div>

            </div>


            <!-- Floating hearts -->

            <div class="floating-heart heart-1">♥</div>
            <div class="floating-heart heart-2">♥</div>
            <div class="floating-heart heart-3">♥</div>
            <div class="floating-heart heart-4">♥</div>
            <div class="floating-heart heart-5">♥</div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
